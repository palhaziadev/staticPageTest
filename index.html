<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Todo List</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f6fa;
    --card: #ffffff;
    --text: #1f2430;
    --muted: #6b7280;
    --border: #e5e7eb;
    --accent: #4f46e5;
    --accent-hover: #4338ca;
    --done: #9ca3af;
    --danger: #ef4444;
    --danger-hover: #dc2626;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161c;
      --card: #1e2129;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --border: #2f333d;
      --done: #6b7280;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    justify-content: center;
    padding: 40px 16px;
  }
  main {
    width: 100%;
    max-width: 480px;
  }
  h1 {
    font-size: 1.5rem;
    margin: 0 0 20px;
    text-align: center;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
  }
  form {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }
  input[type="text"] {
    flex: 1;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text);
    font-size: 1rem;
  }
  input[type="text"]:focus {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }
  button {
    cursor: pointer;
    border: none;
    border-radius: 8px;
    font-size: 0.95rem;
    font-weight: 600;
  }
  form button {
    padding: 10px 16px;
    background: var(--accent);
    color: #fff;
  }
  form button:hover { background: var(--accent-hover); }
  ul {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  li {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
  }
  li .label {
    flex: 1;
    word-break: break-word;
    cursor: pointer;
  }
  li.done .label {
    text-decoration: line-through;
    color: var(--done);
  }
  li input[type="checkbox"] {
    width: 18px;
    height: 18px;
    accent-color: var(--accent);
    cursor: pointer;
    flex-shrink: 0;
  }
  li .remove {
    background: transparent;
    color: var(--danger);
    padding: 4px 8px;
    font-size: 1.1rem;
    line-height: 1;
    flex-shrink: 0;
  }
  li .remove:hover { color: var(--danger-hover); }
  .empty {
    text-align: center;
    color: var(--muted);
    padding: 24px 0;
    font-size: 0.9rem;
  }
  .footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 16px;
    font-size: 0.85rem;
    color: var(--muted);
  }
  .footer button {
    background: transparent;
    color: var(--muted);
    text-decoration: underline;
    padding: 2px 0;
  }
  .footer button:hover { color: var(--text); }
</style>
</head>
<body>
<main>
  <h1>Todo List</h1>
  <div class="card">
    <form id="add-form">
      <input type="text" id="new-item" placeholder="Add a task…" autocomplete="off" maxlength="200" />
      <button type="submit">Add</button>
    </form>
    <ul id="list"></ul>
    <p class="empty" id="empty-msg" hidden>Nothing here yet — add your first task above.</p>
    <div class="footer">
      <span id="count">0 items</span>
      <button type="button" id="clear-done" hidden>Clear completed</button>
    </div>
  </div>
</main>

<script>
(function () {
  const STORAGE_KEY = "todo-items";

  /** @type {{id: string, text: string, done: boolean}[]} */
  let items = load();

  const form = document.getElementById("add-form");
  const input = document.getElementById("new-item");
  const list = document.getElementById("list");
  const emptyMsg = document.getElementById("empty-msg");
  const count = document.getElementById("count");
  const clearDoneBtn = document.getElementById("clear-done");

  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch {
      return [];
    }
  }

  function save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
    } catch {
      /* storage unavailable (private mode, quota) — state just won't persist */
    }
  }

  function render() {
    list.innerHTML = "";
    for (const item of items) {
      const li = document.createElement("li");
      li.className = item.done ? "done" : "";

      const checkbox = document.createElement("input");
      checkbox.type = "checkbox";
      checkbox.checked = item.done;
      checkbox.addEventListener("change", () => toggleDone(item.id));

      const label = document.createElement("span");
      label.className = "label";
      label.textContent = item.text;
      label.addEventListener("click", () => toggleDone(item.id));

      const remove = document.createElement("button");
      remove.type = "button";
      remove.className = "remove";
      remove.textContent = "✕";
      remove.setAttribute("aria-label", "Remove item");
      remove.addEventListener("click", () => removeItem(item.id));

      li.append(checkbox, label, remove);
      list.appendChild(li);
    }

    emptyMsg.hidden = items.length > 0;
    const doneCount = items.filter((i) => i.done).length;
    count.textContent = `${items.length} item${items.length === 1 ? "" : "s"}${
      items.length ? ` · ${doneCount} done` : ""
    }`;
    clearDoneBtn.hidden = doneCount === 0;
  }

  function addItem(text) {
    const trimmed = text.trim();
    if (!trimmed) return;
    items.push({ id: crypto.randomUUID(), text: trimmed, done: false });
    save();
    render();
  }

  function removeItem(id) {
    items = items.filter((i) => i.id !== id);
    save();
    render();
  }

  function toggleDone(id) {
    const item = items.find((i) => i.id === id);
    if (item) item.done = !item.done;
    save();
    render();
  }

  function clearDone() {
    items = items.filter((i) => !i.done);
    save();
    render();
  }

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    addItem(input.value);
    input.value = "";
    input.focus();
  });

  clearDoneBtn.addEventListener("click", clearDone);

  render();
})();
</script>
</body>
</html>
